<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusEye – Live</title><link rel="stylesheet" href="style.css"></head><body>
<div class="w" id="live">
<h1>Live dashboard</h1><p class="s">Real-time status from your ESP32 over WiFi.</p>
<div class="g">
<div class="c"><h3>Device</h3>
<div class="row"><span>Connection</span><span id="conn" class="st">–</span></div>
<div class="row"><span>Clock (RTC)</span><b id="clk">--:--:--</b></div>
<div class="row"><span>Monitoring window</span><span id="mon" class="st">–</span></div>
<div class="row"><span>System</span><span id="arm" class="st">–</span></div>
<div class="row"><span>PIR sensor</span><span id="pir" class="st">–</span></div>
<div class="row"><span>Alarm</span><span id="alm" class="st">–</span></div></div>
<div class="c"><h3>Controls</h3>
<button class="o" data-cmd="arm">Arm</button><button data-cmd="disarm">Disarm</button>
<button class="x" data-cmd="stop">Stop alarm</button><button data-cmd="test">Test alarm</button>
<p style="margin-top:12px">ESP32 IP address</p><input id="ip" placeholder="192.168.1.50" inputmode="decimal">
<p>Control PIN</p><input id="key" type="password" placeholder="PIN"><br><button id="save">Save &amp; connect</button>
<p style="margin-top:8px">First time? See <a href="setup.html">Connect ESP32</a>.</p></div>
</div>
<h2>Event log</h2><div id="log">Waiting for device...</div>
</div><script src="app.js"></script></body></html>
